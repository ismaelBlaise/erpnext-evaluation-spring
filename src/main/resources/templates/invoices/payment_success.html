<div class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded relative" th:if="${success}">
    <span th:text="${success}"></span>
</div>

<h2 class="text-xl font-semibold mb-4">Paiement confirmé</h2>
<p>Le paiement pour la facture <span th:text="${invoiceNumber}" class="font-medium"></span> a été enregistré avec succès.</p>

<a th:href="@{/invoices}" class="mt-4 inline-block bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
    Retour aux factures
</a>
</div>
